# pip install -e ".[dev]" && pre-commit install       (then: pre-commit run --all-files)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6 # keep in sync with RUFF_VERSION in .github/workflows/ci.yml
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown] # ruff also formats code blocks in .md (as CI does)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
