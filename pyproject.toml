[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wholebodypose"
version = "2.0.0.dev0"
description = "Unified whole-body (COCO-WholeBody, 133 keypoints) pose estimation with RTMPose, ViTPose and MediaPipe — ICMV 2025."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0 AND MIT"  # MIT: code contributed up to v1.0.0 (LICENSES/MIT.txt)
license-files = ["LICENSE", "NOTICE", "LICENSES/*", "THIRD_PARTY.md"]
authors = [
    { name = "Cristian Lazo-Quispe" },
    { name = "Renato Castro-Cruz" },
    { name = "Gissella Bejarano" },
    { name = "Mauricio Salazar-Espinosa" },
]
keywords = ["pose estimation", "whole-body", "coco-wholebody", "sign language", "rtmpose", "vitpose", "mediapipe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core = NumPy + OpenCV + ONNX Runtime: enough for RTMPose and ViTPose.
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10.14"]
video = ["imageio-ffmpeg>=0.5"]
filters = ["padasip>=1.2,<2"]
datasets = ["h5py>=3.8"]
# CUDA build of ONNX Runtime; uninstall the CPU `onnxruntime` first (docs/guide/installation.md#gpu).
gpu = ["onnxruntime-gpu>=1.17"]
demo = ["gradio>=6", "gradio_client>=1", "wholebodypose[mediapipe,video]"]
hf = ["huggingface_hub>=0.25"]
all = ["wholebodypose[mediapipe,filters,video]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.6", "pre-commit>=3", "build>=1.2", "wholebodypose[hf,datasets]"]

[project.scripts]
wholebodypose = "wholebodypose.cli:main"
wholebodypose-build-islr = "wholebodypose.datasets.build:main"

[project.urls]
Homepage = "https://cristianlazoquispe.github.io/WholebodyPoseEstimation/"
Repository = "https://github.com/CristianLazoQuispe/WholebodyPoseEstimation"
Issues = "https://github.com/CristianLazoQuispe/WholebodyPoseEstimation/issues"
Changelog = "https://github.com/CristianLazoQuispe/WholebodyPoseEstimation/blob/main/CHANGELOG.md"
Demo = "https://huggingface.co/spaces/CristianLazoQuispe/WholeBodyPoseDemo"
Dataset = "https://huggingface.co/datasets/CristianLazoQuispe/pose-action-recognition"
Weights = "https://huggingface.co/CristianLazoQuispe/wholebodypose-weights"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wholebodypose = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: runs real backends and downloads model weights (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["hf/space/legacy", "hf/dataset_cards"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/wholebodypose/utils/coco133.py" = ["E501"]
"hf/space/ui.py" = ["E501"]  # markdown/BibTeX text
"hf/make_dataset_folder_readmes.py" = ["E501"]  # BibTeX / CFF text

[tool.coverage.run]
source = ["wholebodypose"]
