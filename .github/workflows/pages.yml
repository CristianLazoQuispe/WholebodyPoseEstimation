# Deploys the static project page in website/ to GitHub Pages:
#   https://cristianlazoquispe.github.io/WholebodyPoseEstimation/
# Pages "deploy from a branch" can only serve / or /docs, so the site is published with Actions.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions" (build_type=workflow).
# Every push to main that touches website/ (or this file) redeploys it; it can also be run by hand.
name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check local links
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          html = pathlib.Path("website/index.html").read_text(encoding="utf-8")
          refs = set(re.findall(r'(?:src|href|poster)="([^"#:?]+)"', html))
          missing = [r for r in sorted(refs) if not (pathlib.Path("website") / r).exists()]
          print(f"{len(refs)} local references checked")
          if missing:
              sys.exit("missing files: " + ", ".join(missing))
          EOF
      - name: Check structured data, sitemap and llms.txt
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys, xml.dom.minidom
          html = pathlib.Path("website/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          types = [g["@type"] for b in blocks for g in json.loads(b)["@graph"]]
          print("JSON-LD:", types)
          if sorted(types) != ["Dataset", "ScholarlyArticle", "SoftwareSourceCode"]:
              sys.exit("expected ScholarlyArticle, SoftwareSourceCode and Dataset in the JSON-LD")
          for tag in ("citation_title", "citation_author", "citation_publication_date", "citation_doi", "citation_pdf_url"):
              if f'name="{tag}"' not in html:
                  sys.exit(f"missing <meta name={tag}>")
          xml.dom.minidom.parse("website/sitemap.xml")
          for f in ("robots.txt", "llms.txt"):
              if not (pathlib.Path("website") / f).is_file():
                  sys.exit(f"missing website/{f}")
          print("structured data OK")
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website/
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
