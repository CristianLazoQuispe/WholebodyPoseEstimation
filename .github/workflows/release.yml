# On a version tag (v1.0.0, v1.1.0rc1, ...): build the sdist and wheel, check that the tag matches
# the package version, and publish a GitHub Release whose notes are the matching CHANGELOG section.
#
#   git tag -a v1.0.0 -m "WholeBodyPose 1.0.0" && git push origin v1.0.0
#
# PyPI is NOT published on tag pushes. Publishing is a manual run of this workflow ("Run workflow",
# pick the tag, choose `testpypi` or `pypi`) and only works once a maintainer has done the one-time setup
# in docs/release.md and set the repository variable PYPI_PUBLISHING_ENABLED=true. Both jobs use
# Trusted Publishing (OIDC): no API token is stored in the repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to (pypi = TestPyPI first, then PyPI)"
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: No direct-URL dependencies in the metadata (PyPI rejects them)
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' > "$RUNNER_TEMP/METADATA"
          if grep -E '^Requires-Dist: .*@ *(git\+|https?://|file:)' "$RUNNER_TEMP/METADATA"; then exit 1; fi
      - name: Smoke test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/wholebodypose" --version
          "$RUNNER_TEMP/venv/bin/wholebodypose" backends
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## \[/ { if (p) exit; p = index($0, "## [" ver "]") == 1; next } p' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::no '## [$version]' section in CHANGELOG.md"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Pre-release? (PEP 440)
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME#v}" =~ (a|b|rc|\.dev)[0-9]*$ ]]; then echo "flag=true" >> "$GITHUB_OUTPUT"; else echo "flag=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: WholeBodyPose ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          prerelease: ${{ steps.pre.outputs.flag == 'true' }}

  # Manual only (workflow_dispatch input), and only after the one-time setup in docs/release.md.
  # The metadata has no direct-URL dependencies any more (onepose is a documented manual install), so
  # PyPI accepts it. TestPyPI always runs first; `pypi` additionally needs a release tag.
  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && vars.PYPI_PUBLISHING_ENABLED == 'true' &&
      (inputs.publish == 'testpypi' || inputs.publish == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wholebodypose
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [build, testpypi]
    if: >-
      github.event_name == 'workflow_dispatch' && vars.PYPI_PUBLISHING_ENABLED == 'true' &&
      inputs.publish == 'pypi' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wholebodypose
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
