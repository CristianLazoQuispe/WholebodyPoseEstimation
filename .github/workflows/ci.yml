# Lint, unit tests on every supported Python (core install only), real RTMPose + ViTPose on the core
# install, a package build check and, on main / weekly / on demand, every backend and the examples.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC: catches upstream breakage (MediaPipe, ONNX Runtime, weights URLs)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUFF_VERSION: "0.17.6" # keep in sync with .pre-commit-config.yaml

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, core only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Core install only (NumPy, OpenCV, ONNX Runtime): unit tests use a fake model or no weights.
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow" --cov --cov-report=term-missing:skip-covered
      - name: CLI smoke test
        run: |
          wholebodypose --version
          wholebodypose backends

  test-core-backends:
    name: Real RTMPose + ViTPose on the core install (Python 3.12, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core + dev only)
        run: |
          pip install -e ".[dev]"
          python -c "import importlib.util as u; assert not u.find_spec('mediapipe'), 'core install pulled mediapipe'"
      - name: Restore model weights # default WHOLEBODYPOSE_HOME
        uses: actions/cache@v4
        with:
          path: ~/.cache/wholebodypose
          key: wholebodypose-core-weights-${{ hashFiles('src/wholebodypose/weights.py') }}
          restore-keys: wholebodypose-core-weights-
      - name: Real backends (RTMPose lightweight, ViTPose small)
        run: |
          pytest -ra -m slow tests/test_backends_slow.py -k "rtmpose or vitpose"
          pytest -ra -m slow tests/test_vitpose_onnx.py tests/test_rtmpose_onnx.py
      - name: CLI on a real image
        run: |
          wholebodypose backends
          python -c "from wholebodypose import PoseEstimator as P; k, s = P('rtmpose', mode='lightweight', device='cpu').predict_image('data/images/image.jpg'); print(k.shape); assert len(k) >= 1"

  test-backends:
    name: Real backends (Python 3.11, CPU)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for MediaPipe (EGL/GLES)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1
      - name: Install every backend
        run: |
          pip install -e ".[all,dev]"
          pip list | grep -iE "^(onnxruntime|mediapipe|padasip|numpy|opencv)" || true
      - name: Restore model weights # default WHOLEBODYPOSE_HOME
        uses: actions/cache@v4
        with:
          path: ~/.cache/wholebodypose
          key: wholebodypose-weights-${{ hashFiles('src/wholebodypose/weights.py') }}
          restore-keys: wholebodypose-weights-
      - name: Tests, including slow ones
        run: pytest -ra
      - name: Examples smoke test
        run: |
          python examples/image.py data/images/image.jpg -b mediapipe -o "$RUNNER_TEMP/out/pose.png"
          python examples/video.py data/videos/videoTest.mp4 -b rtmpose --max-frames 5 -o "$RUNNER_TEMP/out"
          mkdir -p "$RUNNER_TEMP/videos/dance" && cp data/videos/videoTest.mp4 "$RUNNER_TEMP/videos/dance/"
          python examples/dataset.py "$RUNNER_TEMP/videos" "$RUNNER_TEMP/out/dataset.hdf5" --max-frames 5

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/wholebodypose" --version
          "$RUNNER_TEMP/venv/bin/wholebodypose" backends
          "$RUNNER_TEMP/venv/bin/python" -c "import wholebodypose, wholebodypose.models.mediapipe.map_mp2coco"
          "$RUNNER_TEMP/venv/bin/python" -c "import onnxruntime, wholebodypose.models.rtmpose._onnx, wholebodypose.models.vitpose.onnx_runtime"
      - name: No direct-URL dependencies in the metadata (PyPI rejects them)
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' > "$RUNNER_TEMP/METADATA"
          if grep -E '^Requires-Dist: .*@ *(git\+|https?://|file:)' "$RUNNER_TEMP/METADATA"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
