# From the repository root:
#   docker compose -f docker/docker-compose-cpu.yaml build
#   docker compose -f docker/docker-compose-cpu.yaml run --rm wholebodypose \
#       wholebodypose video data/videos/videoTest.mp4 -b rtmpose --max-frames 30
#   docker compose -f docker/docker-compose-cpu.yaml up jupyter        # JupyterLab on http://localhost:8888
x-build: &build
  context: ..
  dockerfile: docker/Dockerfile.cpu
  args:
    INSTALL_JUPYTER: "true"

x-volumes: &volumes
  - ..:/workspace
  - weights:/home/wbp/.cache/wholebodypose

services:
  wholebodypose:
    build: *build
    image: wholebodypose:cpu
    volumes: *volumes
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
    stdin_open: true
    tty: true

  jupyter:
    profiles: [jupyter]
    build: *build
    image: wholebodypose:cpu
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    ports:
      - "8888:8888"
    volumes: *volumes

volumes:
  weights:
