# Needs the NVIDIA Container Toolkit. From the repository root:
#   docker compose -f docker/docker-compose-gpu.yaml build
#   docker compose -f docker/docker-compose-gpu.yaml run --rm wholebodypose \
#       wholebodypose video data/videos/videoTest.mp4 -b rtmpose --device cuda
#   docker compose -f docker/docker-compose-gpu.yaml up jupyter        # JupyterLab on http://localhost:8888
x-build: &build
  context: ..
  dockerfile: docker/Dockerfile.gpu
  args:
    INSTALL_JUPYTER: "true"

x-volumes: &volumes
  - ..:/workspace
  - weights:/home/ubuntu/.cache/wholebodypose

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  wholebodypose:
    build: *build
    image: wholebodypose:gpu
    volumes: *volumes
    deploy: *gpu
    stdin_open: true
    tty: true

  jupyter:
    profiles: [jupyter]
    build: *build
    image: wholebodypose:gpu
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
    ports:
      - "8888:8888"
    volumes: *volumes
    deploy: *gpu

volumes:
  weights:
